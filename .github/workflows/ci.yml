name: CI

on:
  pull_request:
    branches: [production]
  push:
    branches: [production]
  workflow_call:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        run: mvn -B -pl parcelemais-sdk -am compile

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '21']
        os: [ubuntu-latest]
        include:
          - java: '21'
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Unit tests
        run: mvn -B -pl parcelemais-sdk -am test

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.java == '21'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: parcelemais-sdk/target/site/jacoco
          fail_ci_if_error: false
